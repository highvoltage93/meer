services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: meetingo
      POSTGRES_USER: meetingo
      POSTGRES_PASSWORD: meetingo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"

volumes:
  postgres_data:
