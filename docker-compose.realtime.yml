services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "5173:5173"
    environment:
      VITE_RTC_PROVIDER: livekit
      VITE_LIVEKIT_URL: ws://127.0.0.1:7880
      VITE_API_BASE_URL: http://127.0.0.1:8787/api
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      CLIENT_ORIGIN: http://127.0.0.1:5173
      DATABASE_URL: postgres://meetingo:meetingo@postgres:5432/meetingo
      JWT_SECRET: local-docker-jwt-secret-change-me
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    depends_on:
      - postgres
      - livekit

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: meetingo
      POSTGRES_USER: meetingo
      POSTGRES_PASSWORD: meetingo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"

volumes:
  postgres_data:
